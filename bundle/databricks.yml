# This is a Declarative Automation Bundle definition for bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: bundle
  uuid: 0a60ac11-3c1c-4898-a1c7-cdeac93fb17c
  # Catalog resources require the direct deployment engine.
  engine: direct

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
    default: db
  service_principal:
    description: Application ID of the target's service principal (svc_small_erp_dev / svc_small_erp_prod)
targets:
  dev:
    default: true
    workspace:
      host: https://dbc-b5cd9353-118f.cloud.databricks.com
    variables:
      catalog: small_erp_dev
      service_principal: 6d15266d-df26-466f-810d-ee18f56d226f
  prod:
    mode: production
    workspace:
      host: https://dbc-b5cd9353-118f.cloud.databricks.com
      root_path: /Workspace/Users/stefangiovan@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: small_erp_prod
      service_principal: 21e51133-e526-4659-901f-714de34e06d2
    permissions:
      - user_name: stefangiovan@gmail.com
        level: CAN_MANAGE
